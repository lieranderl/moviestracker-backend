name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  quality:
    name: quality (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: get-imdb-rating
            module: SERVICES/GetImdbRating
          - name: get-torrents-for-movie
            module: SERVICES/GetTorrentsForMovie
          - name: get-movies-job
            module: JOBS/GetMovies
          - name: download-imdb-job
            module: JOBS/DownloadImdbData

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found unformatted files"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Race
        run: go test -race ./...

      - name: Install staticcheck and gosec
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Gosec
        run: gosec ./...

      - name: GolangCI-Lint
        run: golangci-lint run --config ../../.golangci.yml ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.module }}/coverage.out

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: get-imdb-rating
            module: SERVICES/GetImdbRating
          - name: get-torrents-for-movie
            module: SERVICES/GetTorrentsForMovie
          - name: get-movies-job
            module: JOBS/GetMovies
          - name: download-imdb-job
            module: JOBS/DownloadImdbData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true

      - name: Build binary
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Build Docker image
        working-directory: ${{ matrix.module }}
        run: docker build -t moviestracker/${{ matrix.name }}:${{ github.sha }} .
