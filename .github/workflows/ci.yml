name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: Coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v total="$total" 'BEGIN { exit(total < 50) }'
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  containers:
    needs: go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [getmovies, getimdbrating, downloadimdbdata]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          load: true
          tags: moviestracker/${{ matrix.app }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moviestracker/${{ matrix.app }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: Format
        run: tofu fmt -check -recursive infra
      - name: Validate bootstrap
        run: tofu -chdir=infra/bootstrap init -backend=false && tofu -chdir=infra/bootstrap validate
      - name: Validate production
        run: tofu -chdir=infra/prod init -backend=false && tofu -chdir=infra/prod validate
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
