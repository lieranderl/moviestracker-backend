name: Release backend

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  GCP_PROJECT: moviestracker-f07e2
  GCP_REGION: europe-west1
  GAR_REPOSITORY: moviestracker

jobs:
  guard:
    # A prerelease is a staging marker, not a production rollout.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a semver tag on master
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The workload identity trust accepts only vX.Y.Z tags; fail here with
          # a readable message instead of at authentication.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '${TAG}' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          # Only reviewed, merged code may reach production.
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/master; then
            echo "::error::Release tag '${TAG}' is not reachable from master" >&2
            exit 1
          fi

  verify:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [getmovies, getimdbrating, downloadimdbdata]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64
          load: true
          push: false
          cache-from: type=gha,scope=release-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.app }}
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}:release-${{ github.event.release.tag_name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}:release-${{ github.event.release.tag_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Push scanned candidate
        id: push
        env:
          APP: ${{ matrix.app }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPOSITORY}/${APP}:release-${TAG}"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}@${{ steps.push.outputs.digest }}
          artifact-name: ${{ matrix.app }}-${{ github.event.release.tag_name }}.spdx.json
          # On a release event this action defaults to also attaching the SPDX
          # document as a release asset, which fails here with "Resource not
          # accessible by integration" even when the job token carries
          # contents: write. Three concurrent matrix jobs mutating one release
          # is racy regardless, so the SBOM is retained as a build artifact
          # instead and the job keeps least-privilege contents: read.
          upload-release-assets: false
      # GitHub artifact attestations are unavailable for user-owned private
      # repositories: the API returns "Feature not available for user-owned
      # private repositories". Keep the step so provenance starts being recorded
      # automatically if this repository is made public or moved into an
      # organisation on a plan that supports it, but do not let the platform
      # limitation block delivery. Supply-chain assurance meanwhile rests on
      # digest-pinned deploys, the Trivy gate, and the retained SBOM artifact.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
      - name: Save immutable image
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPOSITORY}/${APP}@${DIGEST}" > "${APP}.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.app }}
          path: ${{ matrix.app }}.digest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Capture current images
        run: |
          mkdir rollback
          gcloud run services describe get-imdb-rating-service --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(spec.template.spec.containers[0].image)' > rollback/getimdbrating
          for collection in latesttorrentsmovies hdr10movies dvmovies; do
            gcloud run jobs describe "getmovies-${collection}-job" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(spec.template.spec.template.spec.containers[0].image)' > "rollback/getmovies-${collection}"
          done
          gcloud run jobs describe downloadimdbdata-job --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(spec.template.spec.template.spec.containers[0].image)' > rollback/downloadimdbdata
      - name: Deploy immutable images
        run: |
          gcloud run services update get-imdb-rating-service --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat getimdbrating.digest)" --quiet
          for collection in latesttorrentsmovies hdr10movies dvmovies; do
            gcloud run jobs update "getmovies-${collection}-job" --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat getmovies.digest)" --quiet
          done
          gcloud run jobs update downloadimdbdata-job --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat downloadimdbdata.digest)" --quiet
      - name: Run fresh-data jobs
        run: |
          gcloud run jobs execute getmovies-latesttorrentsmovies-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
          gcloud run jobs execute getmovies-hdr10movies-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
          gcloud run jobs execute getmovies-dvmovies-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
          gcloud run jobs execute downloadimdbdata-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
      - name: Resolve private IMDb service URL
        id: imdb-service
        run: |
          service_url="$(gcloud run services describe get-imdb-rating-service --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(status.url)')"
          echo "url=${service_url}" >> "$GITHUB_OUTPUT"
      - name: Mint audience-bound IMDb identity token
        id: imdb-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.imdb-service.outputs.url }}
          create_credentials_file: false
          export_environment_variables: false
      - name: Smoke private IMDb service
        env:
          IDENTITY_TOKEN: ${{ steps.imdb-auth.outputs.id_token }}
          IMDB_SERVICE_URL: ${{ steps.imdb-service.outputs.url }}
        run: |
          curl --fail --show-error --silent \
            --header "Authorization: Bearer ${IDENTITY_TOKEN}" \
            "${IMDB_SERVICE_URL}/getimdb?imdb_id=tt0133093" \
            | jq -e '.Id == "tt0133093"'
      - name: Record deployment
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "### Deployed ${TAG} to ${GCP_PROJECT} (${GCP_REGION})"
            echo
            echo "| Workload image | Previous image |"
            echo "| --- | --- |"
            echo "| \`$(cat getimdbrating.digest)\` | \`$(cat rollback/getimdbrating)\` |"
            echo "| \`$(cat getmovies.digest)\` | \`$(cat rollback/getmovies-latesttorrentsmovies)\` |"
            echo "| \`$(cat downloadimdbdata.digest)\` | \`$(cat rollback/downloadimdbdata)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back workload images on failure
        if: failure()
        run: |
          rollback_failed=0
          restore_image() {
            local kind="$1" workload="$2" snapshot="$3" image
            if test ! -s "$snapshot"; then
              return 0
            fi
            if image="$(cat "$snapshot")" && gcloud run "$kind" update "$workload" --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$image" --quiet; then
              return 0
            fi
            echo "::error::Failed to restore ${workload}" >&2
            rollback_failed=1
          }
          restore_image services get-imdb-rating-service rollback/getimdbrating
          for collection in latesttorrentsmovies hdr10movies dvmovies; do
            restore_image jobs "getmovies-${collection}-job" "rollback/getmovies-${collection}"
          done
          restore_image jobs downloadimdbdata-job rollback/downloadimdbdata
          exit "$rollback_failed"
