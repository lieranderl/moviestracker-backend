name: Release backend

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  GCP_PROJECT: moviestracker-f07e2
  GCP_REGION: europe-west1
  GAR_REPOSITORY: moviestracker

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [getmovies, getimdbrating, downloadimdbdata]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}:release-${{ github.event.release.tag_name }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}:release-${{ github.event.release.tag_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Push scanned candidate
        id: push
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPOSITORY}/${{ matrix.app }}:release-${{ github.event.release.tag_name }}"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@v0.20.6
        with:
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}@${{ steps.push.outputs.digest }}
          artifact-name: ${{ matrix.app }}-${{ github.event.release.tag_name }}.spdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GAR_REPOSITORY }}/${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
      - name: Save immutable image
        run: echo "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPOSITORY}/${{ matrix.app }}@${{ steps.push.outputs.digest }}" > "${{ matrix.app }}.digest"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.app }}
          path: ${{ matrix.app }}.digest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Capture current images
        run: |
          mkdir rollback
          gcloud run services describe get-imdb-rating-service --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(spec.template.spec.containers[0].image)' > rollback/getimdbrating
          for collection in latesttorrentsmovies hdr10movies dvmovies; do
            gcloud run jobs describe "getmovies-${collection}-job" --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(spec.template.spec.template.spec.containers[0].image)' > "rollback/getmovies-${collection}"
          done
          gcloud run jobs describe downloadimdbdata-job --project="$GCP_PROJECT" --region="$GCP_REGION" --format='value(spec.template.spec.template.spec.containers[0].image)' > rollback/downloadimdbdata
      - name: Deploy immutable images
        run: |
          gcloud run services update get-imdb-rating-service --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat getimdbrating.digest)" --quiet
          for collection in latesttorrentsmovies hdr10movies dvmovies; do
            gcloud run jobs update "getmovies-${collection}-job" --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat getmovies.digest)" --quiet
          done
          gcloud run jobs update downloadimdbdata-job --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat downloadimdbdata.digest)" --quiet
      - name: Run fresh-data jobs
        run: |
          gcloud run jobs execute getmovies-latesttorrentsmovies-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
          gcloud run jobs execute getmovies-hdr10movies-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
          gcloud run jobs execute getmovies-dvmovies-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
          gcloud run jobs execute downloadimdbdata-job --project="$GCP_PROJECT" --region="$GCP_REGION" --wait
      - name: Smoke IMDb gateway
        env:
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
        run: |
          api_key="$(gcloud secrets versions access latest --secret=GC_API_KEY --project="$GCP_PROJECT")"
          curl --fail --show-error --silent \
            --header "x-api-key: ${api_key}" \
            "${API_GATEWAY_URL}/getimdb?imdb_id=tt0133093" \
            | jq -e '.Id == "tt0133093"'
      - name: Roll back workload images on failure
        if: failure()
        run: |
          test ! -s rollback/getimdbrating || gcloud run services update get-imdb-rating-service --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat rollback/getimdbrating)" --quiet
          for collection in latesttorrentsmovies hdr10movies dvmovies; do
            test ! -s "rollback/getmovies-${collection}" || gcloud run jobs update "getmovies-${collection}-job" --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat "rollback/getmovies-${collection}")" --quiet
          done
          test ! -s rollback/downloadimdbdata || gcloud run jobs update downloadimdbdata-job --project="$GCP_PROJECT" --region="$GCP_REGION" --image="$(cat rollback/downloadimdbdata)" --quiet
