version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: exported
          disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
