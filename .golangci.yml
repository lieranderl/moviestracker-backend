run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosimple
    - revive
    - misspell
    - typecheck

linters-settings:
  revive:
    severity: warning
    rules:
      - name: var-naming
      - name: exported
        disabled: true
